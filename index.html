<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F2430">
<title>Mon CAP Logistique – Révision en jeux</title>
<style>
:root{--ink:#1F2430;--yel:#F0D27A;--grn:#36876B;--red:#B95458;--blu:#4F72B8;--org:#DE9A62;--bg:#F3EFE6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Verdana,"Trebuchet MS",Tahoma,sans-serif;font-size:18px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,.hot:focus-visible{outline:4px solid var(--blu);outline-offset:2px}

/* barre du haut */
#bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:8px 12px 14px;background:var(--ink);color:#fff}
#bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--yel)}
.ib{width:44px;height:44px;border-radius:12px;background:#333b4f;font-size:22px;line-height:1}
.ib.off{opacity:.35}
#tot{margin-left:auto;color:var(--yel);font-weight:700;white-space:nowrap}
#layout{display:flex;align-items:flex-start}
main{flex:1;min-width:0;max-width:860px;margin:0 auto;padding:14px 12px 70px}

/* accueil */
.sign{display:flex;align-items:center;gap:10px;background:var(--yel);border:4px solid var(--ink);border-radius:16px;padding:10px 12px}
.sign::before,.sign::after{content:"";flex:1;min-width:10px;height:16px;border-radius:8px;background:rgba(31,36,48,.25)}
.sign h1{margin:0;font-size:22px;text-align:center}
.pitch{position:relative;height:64px;border-radius:14px;margin:14px 0 8px;border:3px solid #fff;outline:3px solid var(--ink);background:repeating-linear-gradient(90deg,#2E9E5B 0 40px,#34AD63 40px 80px)}
.ball,.goal{position:absolute;top:8px;font-size:38px;line-height:1.2}
.ball{left:6px;transition:left 1.1s cubic-bezier(.3,1.3,.5,1)}
.goal{right:6px}
.lvl{display:flex;align-items:center;gap:10px;font-weight:700;margin:4px 0 14px}
.course{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:var(--yel);border:4px solid var(--ink);border-radius:18px;padding:14px;font-size:24px;font-weight:700;box-shadow:0 5px 0 var(--ink);margin-bottom:18px}
.course:active,.tile:active,.next:active{transform:translateY(3px);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:#fff;border-radius:18px;border-top:12px solid var(--c);padding:10px 8px 12px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.ti{font-size:48px;line-height:1.2}
.tn{font-weight:700;font-size:16px;line-height:1.25;min-height:2.5em;display:flex;align-items:center;justify-content:center}
.ts{font-size:24px;letter-spacing:2px;color:#d3d8e0}
.ts b{color:#E0B24A;font-weight:400}
.reset{display:block;margin:26px auto 0;font-size:14px;opacity:.6;text-decoration:underline}

/* cartes */
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 0 rgba(0,0,0,.14)}
.big{font-size:44px;line-height:1}
h2{font-size:22px;margin:0;flex:1;line-height:1.3}
.spk{flex:none;width:44px;height:44px;border-radius:50%;background:var(--blu);color:#fff;font-size:20px;line-height:1;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.gtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{width:44px;height:44px;border-radius:12px;background:#fff;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.pbar{flex:1;height:16px;background:#cfd6e0;border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grn);border-radius:8px;transition:width .4s}
.pts{font-weight:700;white-space:nowrap}
.story{display:flex;align-items:center;gap:10px;background:#FFF6CC;border-left:8px solid var(--yel);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.story p{margin:0;flex:1}
.qline{display:flex;align-items:center;gap:10px;margin:4px 0 14px}

/* réponses */
.opts{display:grid;gap:10px}
.opts.duo{grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:620px){.opts.n4{grid-template-columns:1fr 1fr}}
.opt{display:flex;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#fff}
.opt.g{background:#DDF6EC;border-color:var(--grn)}
.opt.r{background:#FFE4E5;border-color:var(--red)}
.opt.y{background:#FFF0B3;border-color:#C99A00}
.opt.o{background:#FFE1D1;border-color:var(--org)}
.ans{flex:1;display:flex;align-items:center;gap:10px;padding:12px;text-align:left;font-weight:700}
.oi{font-size:34px;line-height:1}
.duo .ans{flex-direction:column;text-align:center;font-size:22px;padding:16px 6px;justify-content:center}
.duo .oi{font-size:46px}
.opt .spk{width:46px;height:auto;border-radius:0;box-shadow:none}
.opt.good{background:var(--grn)!important;border-color:#0e7a55!important;color:#fff;animation:pop .45s}
.opt.good .ans{color:#fff}
.opt.bad{background:#c9ced6!important;border-color:#9aa1ad!important;opacity:.6}
@keyframes pop{50%{transform:scale(1.05)}}

.fb{margin-top:14px;border-radius:16px;padding:12px}
.fb.ok{background:#DDF6EC;border:3px solid var(--grn)}
.fb.ko{background:#FFF0D6;border:3px solid var(--org)}
.fb.retry{background:#FFF0D6;border:3px solid var(--org);font-weight:700;text-align:center}
.fbt{font-size:22px;margin-bottom:6px}
.why{display:flex;align-items:center;gap:10px}
.why p{margin:0;flex:1}
.next{display:block;margin:14px auto 0;background:var(--ink);color:#fff;border-radius:14px;padding:14px 28px;font-weight:700;font-size:20px;box-shadow:0 5px 0 #000}
.fl{position:absolute;z-index:30;pointer-events:none;font-weight:700;font-size:26px;color:#0e7a55;text-shadow:0 2px 0 #fff;transform:translateX(-50%);animation:up 1s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--yel);padding:10px 20px;border-radius:30px;font-weight:700;z-index:40;animation:up2 1.6s forwards}
@keyframes up2{0%{opacity:0;bottom:0}15%,80%{opacity:1;bottom:22px}100%{opacity:0}}

/* fiche */
.slide .head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.art{max-width:560px;margin:0 auto}
.art svg{width:100%;height:auto;display:block}
.art.tall{max-width:440px}
.hot{cursor:pointer}
.hint{text-align:center;font-size:15px;opacity:.7;margin:6px 0 0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.nb{min-width:56px;height:52px;padding:0 16px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:20px;box-shadow:0 4px 0 #000}
.nb.go{background:var(--grn)}
.nb.ghost{visibility:hidden}
.dots{display:flex;gap:8px}
.dots i{width:14px;height:14px;border-radius:50%;background:#cfd6e0}
.dots i.on{background:var(--ink)}

.vz{display:flex;gap:8px;align-items:flex-start;margin-bottom:14px}
.vz>:first-child{flex:1;margin:0!important}
.plan{border:3px solid var(--ink);border-radius:14px;overflow:hidden;font-size:15px}
.plan .ph{background:#0a3a8a;color:#fff;font-weight:700;text-align:center;padding:6px}
.pr{display:grid;grid-template-columns:44px 1fr 24px 1fr 44px;align-items:center;gap:4px;padding:6px 8px;border-top:2px solid #e3e8f0}
.pr .c{background:#E1ECFB;border-radius:8px;text-align:center;padding:3px 0;font-size:13px;white-space:nowrap}
.pr .c.a{background:#E4F2DA}.pr .c.g{background:#e6e6e6;color:#555}
.pr .b{background:#cfe0fb;border:1px solid var(--blu);border-radius:8px;text-align:center;font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 8px;font-weight:700;font-size:15px}
.tl{display:flex;align-items:center;gap:8px;font-weight:700}
.tl b{background:var(--blu);color:#fff;border-radius:12px;padding:6px 14px;font-size:22px}
.tl i{flex:1;height:6px;background:var(--ink);border-radius:3px}
.duo .ans{font-size:24px}
.ans .oi:empty{display:none}
/* fin de partie */
.endc{text-align:center}
.bigstars{font-size:64px;letter-spacing:6px;color:#d3d8e0}
.bigstars span{display:inline-block;opacity:0}
.bigstars span.on{color:#E0B24A;animation:starin .5s forwards}
@keyframes starin{from{transform:scale(3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.endc h2{font-size:28px;margin:6px 0}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.btns .nb{font-size:18px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
noscript{display:block;padding:20px;font-weight:700}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

.cards{display:block}
.kc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;margin:0 0 8px;box-shadow:0 3px 0 rgba(0,0,0,.15);color:var(--ink)}
.kc:active{transform:translateY(2px);box-shadow:none}
.kc .ki{font-size:38px;line-height:1;flex:none;width:48px;text-align:center}
.kc .kb{flex:1;display:flex;flex-direction:column}
.kc .kb b{font-size:20px;line-height:1.25}
.kc .kb small{font-size:15px;line-height:1.3;opacity:.9}
.kc .ks{opacity:.55;font-size:18px}
.kc.y{background:#F0D27A}.kc.o{background:#DE9A62}.kc.l{background:#EEF1F5}
.kc.b{background:#4F72B8;color:#fff}.kc.g{background:#36876B;color:#fff}.kc.p{background:#8574C4;color:#fff}.kc.r{background:#B95458;color:#fff}.kc.k{background:#1F2430;color:#fff}
.arw{text-align:center;font-size:20px;line-height:1;margin:-2px 0 6px}
.code{font-size:14px;opacity:.7;margin:0 0 12px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tile .ts{font-size:15px;letter-spacing:0;color:#667}
.tile .ts b{color:#E0B24A}
.refbtn{display:block;width:100%;margin:22px 0 0;padding:14px;border-radius:16px;background:#fff;border:3px solid var(--ink);font-weight:700;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.listen{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.spk.huge{width:72px;height:72px;font-size:32px}
.show{font-size:34px;font-weight:700}
.sm{font-size:15px}
.rb{margin-top:14px}
.cl{list-style:none;margin:0;padding:0}
.cl li{display:flex;gap:10px;padding:8px 0;border-top:1px solid #e3e8f0;font-size:16px;line-height:1.35}
.cl li:first-child{border-top:0}
.cl .ci{flex:none;font-size:20px}
.cl small{display:block;font-size:13px;opacity:.75;margin-top:2px}
.gtop h2{font-size:20px}
.slide .head .back{flex:none}
/* menu latéral : conçu pour dyslexie / TDAH
   fond crème (pas de blanc pur), texte gris foncé, police sans empattement,
   interlettrage et interligne aérés, pas de majuscules, cibles >= 48 px,
   une seule matière dépliée à la fois, repère « Tu es ici » */
#side{flex:none;width:300px;position:sticky;top:66px;height:calc(100vh - 66px);overflow-y:auto;background:#FBF6E9;color:#2B2B2B;border-right:3px solid #E4DCC5;padding:14px 12px 40px;font-size:18px;line-height:1.5;letter-spacing:.03em;word-spacing:.1em}
#side .here{background:#FFF;border:2px solid #E4DCC5;border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:16px}
#side .here b{display:block;font-size:14px;color:#5a5a5a;font-weight:400}
#side .nh{padding:2px 6px 8px;font-weight:700;font-size:18px}
#side ul{list-style:none;margin:0;padding:0}
#side>ul>li{margin-bottom:8px}
#side button.nl{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 12px;text-align:left;color:inherit;font:inherit;letter-spacing:inherit;word-spacing:inherit;background:#fff;border:2px solid #E4DCC5;border-radius:14px}
#side button.nl:hover{border-color:#b9ad8a}
#side button.nl.act{background:#FFF1B8;border-color:#2B2B2B;font-weight:700}
#side .ic{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--c,#E4DCC5);font-size:20px;line-height:1}
#side .tx{flex:1;min-width:0}
#side .sc{flex:none;margin-left:6px;font-size:13px;color:#4a4a4a;white-space:nowrap}
#side .sc b{color:#B07A00}
#side .chev{flex:none;width:20px;text-align:center;font-size:16px;transition:transform .2s}
#side .open>.nl .chev{transform:rotate(90deg)}
#side li>ul{display:none;margin:6px 0 4px 22px;padding-left:12px;border-left:4px solid var(--c,#E4DCC5)}
#side li.open>ul{display:block}
#side li>ul button.nl{min-height:48px;font-size:17px;background:transparent;border-color:transparent;padding:6px 10px}
#side li>ul button.nl:hover{background:#fff}
#side li>ul button.nl.act{background:#FFF1B8;border-color:#2B2B2B}
#side hr{border:0;border-top:2px solid #E4DCC5;margin:12px 4px}
#side button:focus-visible{outline:4px solid var(--blu);outline-offset:2px}
#menu{display:none}
#scrim{display:none}
/* réglages d'affichage (bouton Aa) */
body.sz1 main,body.sz1 #side>*{zoom:1.15}
body.sz2 main,body.sz2 #side>*{zoom:1.3}
body.easy{line-height:1.8;letter-spacing:.06em;word-spacing:.16em}
body.easy :not(svg):not(svg *){letter-spacing:.05em;word-spacing:.14em}
body.easy p,body.easy li,body.easy small,body.easy .tn,body.easy .ans{line-height:1.7}
body.easy .tn,body.easy .ans,body.easy .jq,body.easy .ja{font-size:1.08em}
body.hc{--bg:#fff;--ink:#000;background:#fff;color:#000}
body.hc #bar{background:#000}
body.hc .card,body.hc .tile,body.hc .kc,body.hc .refbtn,body.hc .mb,body.hc .mini,body.hc .back,body.hc .bd,body.hc .hintb,body.hc #side button.nl,body.hc #side .here,body.hc .aap{outline:3px solid #000;outline-offset:-3px}
body.hc .opt{border-width:4px;border-color:#000}
body.hc .opt.good{border-color:#000!important}
body.hc .lab,body.hc .fine,body.hc .code,body.hc .sm,body.hc #side .sc,body.hc #side .here b,body.hc .hero .lab{color:#000}
body.hc #side{background:#fff;border-right:4px solid #000}
body.hc #side button.nl.act{background:#FFE066;outline-width:4px}
body.hc button:focus-visible{outline:5px solid #0000FF;outline-offset:2px}
@media(max-width:430px){#bar{gap:4px;padding-left:8px;padding-right:8px}#tot{font-size:15px}}
.aap{position:fixed;top:70px;right:8px;z-index:45;width:min(340px,calc(100vw - 16px));background:#fff;color:#1F2430;border:3px solid #1F2430;border-radius:16px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:18px;line-height:1.4;letter-spacing:0}
.aap{max-height:calc(100vh - 86px);overflow-y:auto}
.aap[hidden]{display:none}
.aap h3{margin:0 0 8px;font-size:19px;display:flex;align-items:center;gap:8px}
.aap h3 span{flex:1}
.aap .al{margin:12px 0 6px;font-weight:700;font-size:16px}
.aap .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.aap .ab{min-height:48px;padding:6px 8px;border-radius:12px;background:#EEF1F5;border:3px solid #cfd6e0;font-weight:700;font-size:16px}
.aap .ab[aria-pressed=true]{background:#FFF1B8;border-color:#1F2430}
.aap .row{display:flex;gap:8px;margin-top:8px}
.aap .row .ab{flex:1;text-align:left;display:flex;align-items:center;gap:8px}
.aap .x{min-width:48px;min-height:48px;border-radius:12px;background:#EEF1F5;font-size:20px}
/* accueil : date, météo, blague */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:14px 0}
.hero .card{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero .lab{font-size:15px;color:#555}
.hero .dt{font-size:24px;font-weight:700;line-height:1.3}
.wxm{display:flex;align-items:center;gap:12px}
.wxi{font-size:52px;line-height:1}
.wxt{font-size:32px;font-weight:700;line-height:1.1}
.wxl{font-size:16px}
.tip{background:#FFF6CC;border-left:6px solid var(--yel);border-radius:10px;padding:6px 10px;font-size:16px}
.mini{align-self:flex-start;font-size:15px;padding:8px 12px;border-radius:10px;background:#EEF1F5;border:2px solid #cfd6e0;font-weight:700}
.jq{font-size:19px;margin:0;flex:1}
.ja{font-size:19px;font-weight:700;margin:0;color:#0e7a55}
.jrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:900px){
  #menu{display:block}
  #side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:40;transform:translateX(-100%);transition:transform .25s;width:min(310px,88vw);padding-top:20px}
  body.nav-open #side{transform:none}
  body.nav-open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
}
/* humeur, conseil, badges */
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mb{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:68px;padding:8px 4px;border-radius:14px;background:#fff;border:2px solid #E4DCC5;font-weight:700;font-size:15px}
.mb span{font-size:32px;line-height:1}
.mb:hover{border-color:#2B2B2B}
.mmsg{background:#FFF6CC;border-left:6px solid var(--yel);border-radius:10px;padding:8px 10px;font-size:16px;margin:0}
.fine{font-size:13px;color:#555;margin:0}
.tipd{font-size:19px;margin:0;flex:1}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.bd{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:#fff;border:2px solid var(--c,#E4DCC5);font-size:15px;font-weight:700}
.bd.lock{opacity:.55;font-weight:400;border-style:dashed;border-color:#b9b4a4}
.newbd{background:#FFF6CC;border:2px solid var(--yel);border-radius:14px;padding:10px 12px;margin:10px 0;font-weight:700}
.hintb{display:block;margin:14px auto 0;min-height:48px;padding:10px 20px;border-radius:14px;background:#FFF6CC;border:3px solid var(--yel);font-weight:700;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.14)}
.hintbox{display:flex;align-items:center;gap:10px;margin-top:12px;background:#FFF6CC;border-left:8px solid var(--yel);border-radius:12px;padding:10px 12px}
.hintbox p{margin:0;flex:1}
.opt.gone{background:#c9ced6;border-color:#9aa1ad;opacity:.5}
.sob{display:flex;align-items:center;gap:10px;background:#E4F2DA;border-left:8px solid var(--grn);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.sob p{margin:0;flex:1;font-weight:700}
.lis{min-height:28px;margin:0 0 8px;font-weight:700;color:#555}
.lis .ok{color:#0e7a55}
.opts.wait{opacity:.5;pointer-events:none}
.opts.wait ~ .hintb{opacity:.5;pointer-events:none}
.typ{display:flex;gap:8px;margin:6px 0 0;align-items:stretch}
.typ input{flex:1;min-width:0;font-size:24px;padding:12px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);font-family:inherit}
.typ input:focus{outline:4px solid var(--blu);outline-offset:2px}
.typ input.good{background:#DDF6EC;border-color:var(--grn)}
.typ input.bad{background:#FFE4E5;border-color:var(--red)}
.recap{background:#fff;border:3px solid #E4DCC5;border-radius:16px;padding:12px;margin:14px 0;text-align:left}
.recap .rt{margin:0 0 8px;font-size:20px}
.recap .cards{margin-top:6px}
.vsw{display:flex;gap:8px;margin:10px 0 6px}
.vsw button{flex:1;min-height:48px;border-radius:14px;background:#fff;border:3px solid #E4DCC5;font-weight:700;font-size:17px}
.vsw button.on{background:#FFF1B8;border-color:#1F2430}
.gtools{margin:6px 0}
.gtools input{width:100%;font-size:18px;padding:12px 14px;border:3px solid #E4DCC5;border-radius:14px;background:#fff;color:var(--ink);font-family:inherit}
#gres{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

<script>
/* ---------- état ---------- */

const KEY1='mouad-cap-ol-v1',KEY='mouad-cap-ol-v2';

// v2 = v1 + schema + qm (mémoire par question). La v1 n'est jamais modifiée ni supprimée.
try{

let vFr=null,vEn=null;

function clean(t){return String(t).replace(/___/g,' blanc ').replace(/(^|[^\d,.])1\s*h\b/g,'$11 heure').replace(/(\d)\s*h\b/g,'$1 heures').replace(/(\d+)e\b/g,'$1ième').replace(/€/g,' euros ').replace(/%/g,' pour cent ').replace(/×/g,' fois ').replace(/−/g,' moins ').replace(/–/g,' à ').replace(/\+/g,' plus ').replace(/=/g,' égale ').replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{2BFF}\u{2700}-\u{27BF}\u{FE0F}\u{200D}]/gu,' ').replace(/\s+/g,' ').trim()}

const cv=$('fx'),cx=cv.getContext('2d');let parts=[],raf=0;

  const cols=['#F0D27A','#36876B','#4F72B8','#B95458','#DE9A62','#ffffff'];
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*12,vy:-Math.random()*12-3,s:5+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:0});
  if(!raf)raf=requestAnimationFrame(loop);
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});

}

 mat1:[['10 % de 80 ?',8,'Pour 10 %, je divise par 10.','80 ÷ 10 = 8.'],['50 % de 60 ?',30,'50 %, c’est la moitié.','La moitié de 60 = 30.'],['25 % de 40 ?',10,'25 %, c’est le quart.','Le quart de 40 = 10.']],
 mat2:[['Combien de grammes dans 2,5 kg ?',2500,'1 kg = 1 000 g.','2,5 × 1 000 = 2 500 g.'],['Combien de kg dans 3 t ?',3000,'1 t = 1 000 kg.','3 × 1 000 = 3 000 kg.'],['Combien de cm dans 2 m ?',200,'1 m = 100 cm.','2 × 100 = 200 cm.']],
 mat3:[['Surface d’une europalette en m² ? (1,2 × 0,8)',0.96,'Surface = longueur × largeur.','1,2 × 0,8 = 0,96 m².'],['5 colis par couche, 4 couches. Combien de colis ?',20,'Colis par couche × nombre de couches.','5 × 4 = 20 colis.']],
 fra5:[['En quelle année a eu lieu la Révolution française ?',1789,'Le chiffre commence par 17.','1789 : la Révolution française.'],['En quelle année la loi sur la laïcité ?',1905,'Le chiffre commence par 19.','1905 : la loi sur la laïcité.'],['En quelle année le droit de vote des femmes ?',1944,'Le chiffre commence par 19.','1944 : le droit de vote des femmes.']],
 duree:[['Durée légale du travail, en heures par semaine ?',35,'Le chiffre commence par 3.','35 heures par semaine.'],['Raï fait 45 h. Combien d’heures supplémentaires ?',10,'45 − 35.','45 − 35 = 10 heures sup.']]
};
const WORDS={
 resp:[['responsabilité','Une faute, un dommage et un lien entre les deux.'],['dommage','Une chose cassée ou une personne blessée.'],['contractuelle','Un contrat n’est pas respecté.'],['faute','Une règle n’est pas respectée.']],
 duree:[['heures supplémentaires','Au-delà de 35 h par semaine.'],['majoration','+ 25 % ou + 50 % selon les heures.']]
};
const FILLQ={
 fra3:[['Complète : « Il ___ un problème. » (a ou à ?)','a','« il a » vient du verbe avoir.','« il a » : le verbe avoir.'],['Complète : « Je vais ___ l’entrepôt. » (a ou à ?)','à','« à l’entrepôt » indique le lieu.','« à » indique le lieu.'],['Complète : « Il ___ en retard. » (est ou et ?)','est','« il est » vient du verbe être.','« il est » : le verbe être.'],['Complète : « Les colis ___ lourds. » (sont ou son ?)','sont','« ils sont » vient du verbe être.','« ils sont » : le verbe être.']]
};
function genEcrire(sq){
  const lang=sq.lang||'fr',seen={},W=(WORDS[sq.id]||[]).map(x=>({w:x[0],t:x[1]}));
  W.forEach(x=>seen[x.w.toLowerCase()]=1);
  (sq.slides||[]).filter(sl=>!sl.keep&&sl.cards).forEach(sl=>sl.cards.forEach(c=>{
    const w=String(c.b||'').replace(/\s*[….?]+$/,'').trim(),k=w.toLowerCase();
    if(/^[A-Za-zÀ-ÿ0-9’' .,!?-]{3,34}$/.test(w)&&/[A-Za-zÀ-ÿ]/.test(w)&&w.split(' ').length<=6&&!/ \/ /.test(w)&&!seen[k]){seen[k]=1;W.push({w,t:c.t||''})}
  }));
  W.sort((a,b)=>(b.w.length>=5)-(a.w.length>=5));        // les mots d'au moins 5 lettres d'abord, ordre des fiches sinon
  const pick=W.slice(0,5),qs=[];
  pick.forEach((x,i)=>{
    if(i<2)qs.push({type:'type',mode:'copy',icon:'⌨️',text:'Recopie le mot : '+x.w,show:x.w,sub:x.t,answers:[x.w],hl:lang,why:'On écrit : '+x.w+'.'});
    else qs.push({type:'type',mode:'dict',icon:'🎧',text:'Écoute et écris le mot n°'+(i-1),hear:x.w,sub:x.t,hl:lang,answers:[x.w],why:'Le mot est : '+x.w+'.'});
  });
  (FILLQ[sq.id]||[]).forEach(n=>qs.push({type:'type',mode:'fill',strict:true,icon:'✏️',text:n[0],answers:[n[1]],hint:n[2],why:n[3]}));
  (NUMQ[sq.id]||[]).forEach(n=>qs.push({type:'type',mode:'num',num:true,icon:'🧮',text:n[0],answers:[String(n[1])],hint:n[2],why:n[3]}));
  return qs.length>=3?{id:sq.id+'_ecr',icon:'⌨️',name:'J’écris',c:'#4F72B8',qs}:null;
}

async function loadWx(){
  const loc=S.loc||{lat:48.8566,lon:2.3522,name:'Paris'},k=loc.lat+','+loc.lon;
  if(WX.k!==k)WX.d=null;
  try{
    if(!(WX.d&&Date.now()-WX.t<9e5)){
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`);
      if(!r.ok)throw new Error(r.status);
      WX.d=await r.json();WX.k=k;WX.t=Date.now();

    wxErr=false;
  }catch(e){wxErr=!WX.d}
  renderWx();
}

/* ---------- vue « Carte » : un graphe à explorer (matières, cours, mots du métier) ---------- */
// Données : matières -> cours -> mots du métier (reliés quand le mot figure dans le contenu du cours).
// Un mot relie plusieurs cours, parfois de matières différentes : c'est ce que la carte montre.
const GALIAS={bl:['bon de livraison'],bc:['bon de commande'],fifo:['fifo'],fefo:['fefo'],epi:['epi','equipement de protection'],caces:['caces'],avarie:['avarie'],reserves:['reserves'],picking:['picking'],palette:['palette'],europalette:['europalette'],quai:['quai'],supply:['supply chain','chaine logistique'],cariste:['cariste'],chariot:['chariot'],transpalette:['transpalette'],inventaire:['inventaire'],stock:['stock'],rupture:['rupture de stock','ruptures de stock'],reception:['reception'],expedition:['expedition'],codebarres:['code-barres','code barres'],dlc:['dlc','date limite'],samu:['samu']};
// TMS et WMS (logiciels) ne sont volontairement pas reliés : « TMS » désigne aussi les troubles musculosquelettiques dans le cours sur les gestes et postures.
const gfold=t=>String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'");
const gstrip=h=>String(h||'').replace(/<[^>]+>/g,' ');
const gtext=sq=>gfold([sq.name,sq.goal,...(sq.slides||[]).flatMap(sl=>[sl.title,gstrip(sl.svg),...(sl.cards||[]).flatMap(c=>[c.b,c.t])]),...sq.games.filter(g=>!g.id.endsWith('_ecr')).flatMap(g=>[g.name,...g.qs.flatMap(q=>[q.text,q.why,q.story])])].join(' | '));
const GT={},GS={};      // GT[cours] = mots ; GS[mot] = cours
BLOCS.forEach(b=>b.seqs.forEach(sq=>{
  const tx=gtext(sq);GT[sq.id]=[];
  Object.keys(GALIAS).forEach(k=>{if(GLOSSAIRE[k]&&GALIAS[k].some(a=>tx.includes(a))){GT[sq.id].push(k);(GS[k]=GS[k]||[]).push(sq.id)}});
}));
const gBloc=sid=>BLOCS.find(b=>b.seqs.some(q=>q.id===sid));
let G={links:false,open:null,seq:null,sel:'hub',vx:0,vy:0,vw:420,px:360,py:480,moved:false,raf:0};
const gU=()=>G.vw/G.px;
function gLayout(){
  const N=[],E=[],hub={id:'hub',x:500,y:500,r:50,type:'hub'};N.push(hub);
  const nb=BLOCS.length,pos={};
  BLOCS.forEach((b,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/nb,x=500+160*Math.cos(a),y=500+160*Math.sin(a);pos[b.id]={x,y,a};
    const mx=blocMax(b);
    N.push({id:'b:'+b.id,type:'bloc',x,y,r:36,icon:b.icon,label:SHORT[b.id]||b.name,full:b.name,c:b.c,p:mx?blocStars(b)/mx:0,dim:G.open&&G.open!==b.id});
    E.push(['hub','b:'+b.id,G.open===b.id?'on':'']);
  });
  if(G.open){
    const b=findBloc(G.open),P=pos[b.id],m=b.seqs.length,step=m>1?Math.min(.34,1.5/(m-1)):0;
    b.seqs.forEach((q,j)=>{
      const a=P.a+(j-(m-1)/2)*step,x=500+340*Math.cos(a),y=500+340*Math.sin(a),mx=q.games.length*3;
      pos[q.id]={x,y,a};
      N.push({id:'s:'+q.id,type:'seq',x,y,r:28,icon:q.icon,label:q.name,full:q.name,c:b.c,p:mx?seqStars(q)/mx:0,dim:G.seq&&G.seq!==q.id});
      E.push(['b:'+b.id,'s:'+q.id,G.seq===q.id?'on':'']);
    });
    if(G.seq&&pos[G.seq]){
      const Q=pos[G.seq],T=GT[G.seq]||[],t=T.length,st=t>1?Math.min(.62,2.4/(t-1)):0;
      T.forEach((k,j)=>{
        const a=Q.a+(j-(t-1)/2)*st,x=Q.x+105*Math.cos(a),y=Q.y+105*Math.sin(a);
        pos['t:'+k]={x,y};
        N.push({id:'t:'+k,type:'term',x,y,r:24,icon:GLOSSAIRE[k].i,label:SHORT_T(k),full:GLOSSAIRE[k].t,c:b.c,p:0,dim:false});
        E.push(['s:'+G.seq,'t:'+k,G.sel==='t:'+k?'on':'']);
      });
    }
  }
  // un mot sélectionné : ses autres cours apparaissent près de leur matière (liens entre matières)
  if(G.sel.startsWith('t:')){
    const k=G.sel.slice(2),others=(GS[k]||[]).filter(id=>id!==G.seq);
    if(pos['t:'+k]){
      others.forEach(id=>{
        const bl=gBloc(id);if(!bl)return;
        if(G.open===bl.id){E.push(['t:'+k,'s:'+id,'x']);return}
        const idx=others.filter(o=>gBloc(o).id===bl.id).indexOf(id),cnt=others.filter(o=>gBloc(o).id===bl.id).length,P=pos[bl.id];
        const a=P.a+(idx-(cnt-1)/2)*.2,x=500+300*Math.cos(a),y=500+300*Math.sin(a),q=findSeq(bl.id,id);
        N.push({id:'s:'+id,type:'ghost',x,y,r:20,icon:q.icon,label:q.name,full:q.name,c:bl.c,p:0,dim:false});
        E.push(['t:'+k,'s:'+id,'x']);E.push(['b:'+bl.id,'s:'+id,'']);
      });
    }
  }
  return {N,E};
}
const gIco=(n,size)=>String(n.icon).startsWith('<svg')?`<svg x="${n.x-size*0.85}" y="${n.y-size*0.58}" width="${size*1.7}" height="${size*1.13}" viewBox="0 0 60 40">${String(n.icon).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</svg>`:T(n.x,n.y+n.r*0.34,size,n.icon);
function SHORT_T(k){const t=GLOSSAIRE[k].t;return t.replace(/ \(.*\)$/,'')}
function gSvg(){
  const {N,E}=gLayout(),idx={};N.forEach(n=>idx[n.id]=n);
  const edges=E.map(([a,b,c])=>{const A=idx[a],B=idx[b];if(!A||!B)return '';
    const cross=c==='x';
    return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${cross?'#B95458':c==='on'?'#1F2430':'#bdb4a0'}" stroke-width="${c==='on'||cross?5:3}" ${cross?'stroke-dasharray="9 7"':''} stroke-linecap="round"/>`}).join('');
  const nodes=N.map(n=>{
    const sel=G.sel===n.id,op=n.dim?.35:1,circ=2*Math.PI*(n.r-4);
    let body='';
    if(n.type==='hub')body=`<circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="#F0D27A" stroke="#1F2430" stroke-width="${sel?8:5}"/>`+T(n.x,n.y+8,26,'CAP','#1F2430',800)+T(n.x,n.y+26,13,'Logistique','#1F2430',400);
    else{
      body=`<circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${n.type==='term'?'#fff':'#fff'}" stroke="${n.type==='term'||n.type==='ghost'?'#9aa1ad':'#E4DCC5'}" stroke-width="${n.type==='term'||n.type==='ghost'?4:8}" ${n.type==='term'||n.type==='ghost'?'stroke-dasharray="7 5"':''}/>`
        +(n.p>0&&n.type!=='term'?`<circle cx="${n.x}" cy="${n.y}" r="${n.r-4}" fill="none" stroke="${n.c}" stroke-width="8" stroke-dasharray="${circ*n.p} ${circ}" transform="rotate(-90 ${n.x} ${n.y})"/>`:'')
        +(sel?`<circle cx="${n.x}" cy="${n.y}" r="${n.r+8}" fill="none" stroke="#1F2430" stroke-width="5"/>`:'')
        +gIco(n,Math.round(n.r*0.95))
        +wrap(n.label,n.type==='bloc'?12:14).slice(0,3).map((l,i)=>T(n.x,n.y+n.r+(n.type==='bloc'?22:18)+i*(n.type==='bloc'?19:16),n.type==='bloc'?17:n.type==='seq'?15:13,X(l),'#1F2430',n.type==='bloc'?800:700)).join('');
    }
    return `<g class="gn" data-n="${n.id}" role="button" tabindex="0" aria-label="${esc(n.full||'Logistique')}" opacity="${op}" onclick="gSel('${n.id}')" onkeydown="if(event.key==='Enter')gSel('${n.id}')" style="cursor:pointer">${body}</g>`;
  }).join('');
  return {svg:`<svg id="gsvg" viewBox="${G.vx} ${G.vy} ${G.vw} ${G.vw*G.py/G.px}" role="group" aria-label="Carte des matières, des cours et des mots du métier">${DEFS}${edges}${nodes}</svg>`,N};
}
function gInspector(){
  const id=G.sel,chip=(i,l,fn)=>`<button class="mini" onclick="${fn}">${i} ${X(l)}</button>`;
  if(id==='hub')return `<p><b>🕸️ La carte du CAP</b></p><p class="sm">Touche une matière pour voir ses cours. Touche un cours pour voir ses mots. Les mots relient les cours entre eux.</p>`;
  if(id.startsWith('b:')){const b=findBloc(id.slice(2));return `<p><b>${b.icon} ${X(b.name)}</b> ${spk(b.name)}</p><p class="sm">★ ${blocStars(b)}/${blocMax(b)} · ${b.seqs.length} cours</p><div class="btns" style="justify-content:flex-start"><button class="nb go" onclick="openBloc('${b.id}')">📂 Ouvrir la matière</button></div>`}
  if(id.startsWith('s:')){const sid=id.slice(2),b=gBloc(sid),q=findSeq(b.id,sid),T=GT[sid]||[];
    return `<p><b>${q.icon} ${X(q.name)}</b> ${spk(q.name)}</p>${q.goal?`<p class="sm">🎯 ${X(q.goal)}</p>`:''}<p class="sm">★ ${seqStars(q)}/${q.games.length*3}</p><div class="btns" style="justify-content:flex-start"><button class="nb go" onclick="openSeq('${b.id}','${sid}')">▶️ Ouvrir le cours</button></div>${T.length?`<p class="sm" style="margin:10px 0 4px">Les mots de ce cours :</p><div class="chs">${T.map(k=>chip(GLOSSAIRE[k].i,SHORT_T(k),`gSel('t:${k}')`)).join('')}</div>`:''}`}
  if(id.startsWith('t:')){const k=id.slice(2),g=GLOSSAIRE[k],S2=GS[k]||[];
    return `<p><b>${g.i} ${X(g.t)}</b> ${spk((g.v||g.t)+'. '+g.d)}</p><p>${X(g.d)}</p>${S2.length>1?'<button class="mini" onclick="gLinks()">🔭 Voir les liens sur la carte</button>':''}${S2.length?`<p class="sm" style="margin:10px 0 4px">Ce mot revient dans ${S2.length} cours :</p><div class="chs">${S2.map(sid=>{const q=findSeq(gBloc(sid).id,sid);return chip(q.icon,q.name,`gSel('s:${sid}')`)}).join('')}</div>`:''}`}
  return '';
}
function carteHtml(){
  return `<div class="gtools"><input id="gq" type="search" placeholder="🔎 Chercher un cours ou un mot" aria-label="Chercher dans la carte" oninput="gSearch(this.value)" autocomplete="off"><div id="gres"></div></div>
  <div class="gwrap" id="gwrap"><div class="gz"><button class="mini" onclick="gZoom(1/1.3)" aria-label="Zoom avant">➕</button><button class="mini" onclick="gZoom(1.3)" aria-label="Zoom arrière">➖</button><button class="mini" onclick="gAll()" aria-label="Tout voir">⟲</button></div><div id="gcv"></div></div>

function gRender(){const r=gSvg();$('gcv').innerHTML=r.svg;$('gins').innerHTML=gInspector();return r.N}
function gSetVB(){const v=$('gsvg');if(v)v.setAttribute('viewBox',`${G.vx} ${G.vy} ${G.vw} ${G.vw*G.py/G.px}`)}
function gFit(ids,pad,inst){
  const {N}=gLayout(),S2=N.filter(n=>ids.includes(n.id));if(!S2.length)return;
  const x0=Math.min(...S2.map(n=>n.x-n.r-20)),x1=Math.max(...S2.map(n=>n.x+n.r+20)),y0=Math.min(...S2.map(n=>n.y-n.r-20)),y1=Math.max(...S2.map(n=>n.y+n.r+70));
  const bw=x1-x0+(pad||40),bh=y1-y0+(pad||40),vw=Math.max(380,bw,bh*G.px/G.py),vh=vw*G.py/G.px;
  const tx=(x0+x1)/2-vw/2,ty=(y0+y1)/2-vh/2;
  if(inst){cancelAnimationFrame(G.raf);G.vx=tx;G.vy=ty;G.vw=vw;gSetVB()}else gTween(tx,ty,vw);
}
function gTween(tx,ty,tw){
  cancelAnimationFrame(G.raf);
  if(reduce){G.vx=tx;G.vy=ty;G.vw=tw;gSetVB();return}
  const a={x:G.vx,y:G.vy,w:G.vw},t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/280),e=1-Math.pow(1-k,3);G.vx=a.x+(tx-a.x)*e;G.vy=a.y+(ty-a.y)*e;G.vw=a.w+(tw-a.w)*e;gSetVB();if(k<1)G.raf=requestAnimationFrame(step)};
  G.raf=requestAnimationFrame(step);
}
function gFocus(inst){
  if(G.sel.startsWith('t:')&&G.links){const {N:L}=gLayout();return gFit(L.filter(n=>n.type==='term'||n.type==='ghost'||n.id==='s:'+G.seq||n.id==='b:'+G.open).map(n=>n.id),30,inst)}
  if(G.sel==='hub'||(!G.open&&!G.seq))return gFit(['hub',...BLOCS.map(b=>'b:'+b.id)],20,inst);
  const ids=['b:'+G.open];const {N}=gLayout();
  N.forEach(n=>{if(n.type==='seq'||n.type==='term'||n.type==='ghost')ids.push(n.id)});
  if(G.seq)gFit(['b:'+G.open,'s:'+G.seq,...N.filter(n=>n.type==='term').map(n=>n.id)],30,inst);
  else gFit(ids,30,inst);
}
function gLinks(){G.links=true;gRender();gFocus()}
function gAll(){G.sel='hub';G.open=null;G.seq=null;gRender();gFocus()}
function gSel(id){
  if(G.moved){G.moved=false;return}
  if(id==='hub'){G.open=null;G.seq=null;G.sel='hub'}
  else if(id.startsWith('b:')){const b=id.slice(2);if(G.open===b&&G.sel===id){G.open=null;G.seq=null;G.sel='hub'}else{G.open=b;G.seq=null;G.sel=id}}
  else if(id.startsWith('s:')){const q=id.slice(2);G.open=gBloc(q).id;G.seq=q;G.sel=id}

}
function gSearch(q){

function gZoom(f){const cx=G.vx+G.vw/2,cy=G.vy+G.vw*G.py/G.px/2;G.vw=Math.max(220,Math.min(1500,G.vw*f));G.vx=cx-G.vw/2;G.vy=cy-G.vw*G.py/G.px/2;gSetVB()}
function carteInit(){
  const w=$('gwrap');if(!w)return;
  G.px=w.clientWidth||360;G.py=w.clientHeight||480;
  gRender();gFocus(true);
  const P=new Map();let a0=null;
  w.addEventListener('pointerdown',e=>{if(e.target.closest('.gz'))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});G.moved=false;a0={vx:G.vx,vy:G.vy,vw:G.vw,d:0,sx:e.clientX,sy:e.clientY}});
  w.addEventListener('pointermove',e=>{
    if(!P.has(e.pointerId))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size===1&&a0){const dx=e.clientX-a0.sx,dy=e.clientY-a0.sy;if(Math.abs(dx)+Math.abs(dy)>8)G.moved=true;if(G.moved){const u=a0.vw/G.px;G.vx=a0.vx-dx*u;G.vy=a0.vy-dy*u;G.vw=a0.vw;gSetVB()}}
    else if(P.size===2){const [p,q]=[...P.values()],d=Math.hypot(p.x-q.x,p.y-q.y);if(!a0.d)a0.d=d;G.moved=true;const nw=Math.max(220,Math.min(1500,a0.vw*a0.d/d)),cx=a0.vx+a0.vw/2,cy=a0.vy+a0.vw*G.py/G.px/2;G.vw=nw;G.vx=cx-nw/2;G.vy=cy-nw*G.py/G.px/2;gSetVB()}
  });
  const up=e=>{P.delete(e.pointerId);if(!P.size)a0=null;else{const [p]=[...P.values()];a0={vx:G.vx,vy:G.vy,vw:G.vw,d:0,sx:p.x,sy:p.y}}};
  w.addEventListener('pointerup',up);w.addEventListener('pointercancel',up);

/* ---------- mémoire par question (Leitner) et mission du jour ---------- */
// Jour local sous forme d'entier. window.__day permet de simuler les jours dans les tests.
const dayNum=()=>{if(window.__day!==undefined)return window.__day;const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
const LEIT=[0,1,3,7,21];            // jours avant la prochaine révision, par boîte 0..4
const MISSION_MAX=8;
const hash32=t=>{let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)};
const norm=t=>String(t).toLowerCase().replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
// QIDX : id de question -> {q,g,s,b}. L'id = hash(jeu + texte) ; si deux questions d'un même jeu ont le même texte, on ajoute -2, -3…
const QIDX=new Map();
BLOCS.forEach(b=>b.seqs.forEach(sq=>sq.games.forEach(g=>{
  const seen={};
  g.qs.forEach(q=>{
    const base=hash32(g.id+'|'+norm(q.text));seen[base]=(seen[base]||0)+1;
    q.id=seen[base]>1?base+'-'+seen[base]:base;
    QIDX.set(q.id,{q,g,s:sq,b});
  });
})));
// ---- maîtrise = questions en boîte 3 ou plus (les étoiles, elles, ne baissent jamais)
const isMas=id=>S.qm[id]&&S.qm[id].b>=3;
const seqQs=sq=>sq.games.flatMap(g=>g.qs);
const masOf=qs=>qs.length?qs.filter(q=>isMas(q.id)).length/qs.length:0;
const allSeqs=()=>BLOCS.flatMap(b=>b.seqs.map(sq=>({b,sq})));
const seqById=id=>{for(const b of BLOCS){const q=b.seqs.find(x=>x.id===id);if(q)return q}return null};
// fraîcheur d'une séquence, dite positivement : jamais de « perdu », seulement « à revoir »
function freshOf(sq){
  const t=dayNum(),qs=seqQs(sq).filter(q=>S.qm[q.id]);
  if(!qs.length)return null;
  const n=qs.filter(q=>S.qm[q.id].due<=t).length;
  return n?{k:'rev',icon:'🔄',txt:'À revoir',n}:{k:'ok',icon:'🌿',txt:'À jour',n:0};
}
// compétence du référentiel : moyenne de maîtrise de ses séquences ; null si aucune séquence ne la travaille
const compMas=c=>{const ss=c.s.map(seqById).filter(Boolean);return ss.length?ss.reduce((a,sq)=>a+masOf(seqQs(sq)),0)/ss.length:null};
const COMP_OK=.8;
function capStats(){
  let n=0,ok=0;
  BLOCS.forEach(b=>{if(b.id==='droit')return;b.comps.forEach(c=>{const m=compMas(c);if(m===null)return;n++;if(m>=COMP_OK)ok++})});
  return {n,ok};
}
const currentSeq=()=>{const l=S.last;let sq=l&&seqById(l.sid);return sq||BLOCS[0].seqs[0]};
const absentDays=()=>S.lastDay==null?0:dayNum()-S.lastDay;
const absent=()=>absentDays()>=3;
// ---- personnalisation : débloquée par la maîtrise (maximum atteint, donc jamais retirée)
const AV_ICONS=[['👷','Casque',0],['🧑‍🏭','Opérateur',4],['🧑‍🔧','Technicien',10],['🧑‍💼','Chef',16]];
const AV_COLS=[['#F0D27A','Jaune',0],['#F2A65A','Orange',2],['#7BC8A4','Vert',6],['#7FA6E0','Bleu',12],['#B79AE0','Violet',20]];
const masCount=()=>[...QIDX.values()].filter(e=>isMas(e.q.id)).length;
const avatar=()=>Object.assign({i:'👷',c:'#F0D27A'},S.av||{});
const avHtml=()=>{const a=avatar();return `<span class="av" style="--vc:${a.c}" aria-hidden="true">${a.i}</span>`};
function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}
function noteMastery(){
  const m=masCount(),old=S.maxMas||0;
  if(m>old){
    S.maxMas=m;
    const nw=[...AV_ICONS,...AV_COLS].filter(x=>x[2]>old&&x[2]<=m);
    const pal=MIL.filter(x=>x>old&&x<=m).length;
    if(pal){addTk(2*pal);toast('🎟️ +'+2*pal+' tickets : je maîtrise '+m+' questions !')}
    else if(nw.length)toast('🎉 Nouveau pour mon cariste !');
  }
}
function recordQ(q,ok){
  if(!q||!q.id)return;
  const t=dayNum(),m=S.qm[q.id]||(S.qm[q.id]={b:0,last:t,due:t,n:0,ok:0});
  const wasDue=m.due<=t||m.n===0;
  m.n++;if(ok)m.ok++;m.last=t;
  if(ok){if(wasDue){m.b=Math.min(4,m.b+1);m.due=t+LEIT[m.b]}}   // réussir avant l'échéance ne fait pas monter la boîte
  else{m.b=m.b>=2?1:0;m.due=t+LEIT[m.b]}                          // erreur : retour boîte 0 ou 1, jamais en dessous de 0
  if(!S.today||S.today.d!==t)S.today={d:t,n:0};
  S.today.n++;S.lastDay=t;
  noteMastery();
  save();
}
const fmtOf=q=>q.type?'type':q.hear?'hear':q.viz?'viz':q.opts.length===2?'bin':q.story?'story':'qcm';
// évite deux fois le même format d'affilée quand c'est possible
function mixFormats(list){
  const out=[],rest=list.slice();let prev=null;
  while(rest.length){
    // parmi les formats différents du précédent, on prend le plus fréquent encore à placer (sinon les doublons s'accumulent à la fin)
    const cnt={};rest.forEach(e=>{const f=fmtOf(e.q);cnt[f]=(cnt[f]||0)+1});
    let k=-1,best=0;rest.forEach((e,j)=>{const f=fmtOf(e.q);if(f!==prev&&cnt[f]>best){best=cnt[f];k=j}});
    if(k<0)k=0;
    const e=rest.splice(k,1)[0];out.push(e);prev=fmtOf(e.q);
  }
  return out;
}
// Mission : 4-5 questions à revoir (les plus en retard) + 2-3 nouvelles de la séquence en cours, 8 au maximum
function buildMission(){
  const t=dayNum(),all=[...QIDX.values()];
  const due=all.filter(e=>S.qm[e.q.id]&&S.qm[e.q.id].due<=t).sort((a,b)=>(S.qm[a.q.id].due-S.qm[b.q.id].due));
  const light=absent();                                  // après 3 jours ou plus d'absence : mission allégée, sans reproche
  const rev=due.slice(0,light?3:5);
  const nNew=light?Math.min(2,5-rev.length):Math.min(MISSION_MAX-rev.length,rev.length>=4?3:5);
  const seqs=BLOCS.flatMap(b=>b.seqs.map(sq=>({b,sq})));
  const l=S.last,i=l?seqs.findIndex(x=>x.b.id===l.bid&&x.sq.id===l.sid):-1;
  const order=i>=0?seqs.slice(i).concat(seqs.slice(0,i)):seqs;
  const fresh=[];
  // séquence par séquence ; dans une séquence on alterne les formats (puis les jeux) pour de la variété
  for(const x of order){
    const groups={};
    x.sq.games.forEach(g=>g.qs.forEach(q=>{if(!S.qm[q.id]){const f=fmtOf(q);(groups[f]=groups[f]||[]).push(q)}}));
    const gs=Object.values(groups);
    while(fresh.length<nNew&&gs.some(a=>a.length))for(const a of gs)if(a.length&&fresh.length<nNew)fresh.push(Object.assign({isNew:true},QIDX.get(a.shift().id)));
    if(fresh.length>=nNew)break;
  }
  let list=[];const r=rev.slice(),n=fresh.slice();
  while(r.length||n.length){if(r.length)list.push(r.shift());if(n.length)list.push(n.shift())}
  // complément : s'il y a peu à faire, on ajoute les questions les plus proches de leur échéance (4 au minimum)
  if(list.length<4){
    const ids=new Set(list.map(e=>e.q.id));
    all.filter(e=>S.qm[e.q.id]&&!ids.has(e.q.id)).sort((a,b)=>S.qm[a.q.id].due-S.qm[b.q.id].due).slice(0,4-list.length).forEach(e=>list.push(e));
  }
  return mixFormats(list);
}
function startMission(){
  const list=buildMission();if(!list.length)return;
  ctx={bid:null,sid:null};
  const nw=list.filter(e=>e.isNew).pop();if(nw){S.last={bid:nw.b.id,sid:nw.s.id};save()}
  cur={g:{id:'_mission',icon:'▶️',name:'Ma mission du jour',mix:true},s:null,qs:list.map(e=>e.q),i:0,pts:0,first:0,tries:0,locked:false,streak:0,missed:new Set(),review:false,mission:true,cf:0,cs:0};
  showQ();
}

// ---- progression sur 3 horizons : aujourd'hui, ma séquence, mon CAP
function progHtml(){
  const t=dayNum(),n=S.today&&S.today.d===t?S.today.n:0,done=S.mission&&S.mission.day===t;
  const sq=currentSeq(),sm=Math.round(masOf(seqQs(sq))*100),f=freshOf(sq),cs=capStats();
  const pips=Array.from({length:MISSION_MAX},(_,k)=>`<i class="${k<n?'on':''}"></i>`).join('');
  return `<div class="card prog" aria-label="Ma progression">

function memoTap(i){
  if(!M||M.busy||M.done[i]||M.open.includes(i))return;

  M.moves++;
  const [a,b]=M.open,ok=M.cards[a].p===M.cards[b].p;

    M.done[a]=M.done[b]=true;M.found++;M.open=[];

// Régulation vers ~85 % de réussite : 2 échecs de suite → plus d'aide ; 5 réussites du premier coup → on réduit l'aide
function reg(ok){
  if(ok){cur.cf=0;cur.assist=false;cur.cs=(cur.cs||0)+1;if(cur.cs>=5)cur.lean=true}
  else{cur.cs=0;cur.lean=false;cur.cf=(cur.cf||0)+1;if(cur.cf>=2){cur.assist=true;easeQueue()}}
}
function easeQueue(){
  if(cur.g.seq)return;
  const rest=cur.qs.slice(cur.i+1);if(rest.length<2)return;
  const e=q=>(q.opts&&q.opts.length===2?0:1)+(S.qm[q.id]&&S.qm[q.id].b>=2?0:1);
  cur.qs=cur.qs.slice(0,cur.i+1).concat(rest.sort((a,b)=>e(a)-e(b)));
}

/* ---------- rythme calme ---------- */
const calm=()=>S.calm!==false;
// 'self' : le bouton se débloque après 1,5 s, la voix continue et un tap la coupe. 'wait' : on attend la fin de la voix.
const pace=()=>S.pace||(S.easy?'wait':'self');
const SELF_MS=1500;
// attend la fin de la voix (ou un délai si la voix est coupée), puis appelle done une seule fois
function hold(text,lang,done){
  if(pace()==='self'){if(S.auto)say(text,lang);setTimeout(done,SELF_MS);return}
  const ms=Math.min(7000,Math.max(2500,String(text).length*55));
  let fin=false;const go=()=>{if(fin)return;fin=true;done()};
  if(S.auto&&'speechSynthesis' in window){say(text,lang,()=>setTimeout(go,400));setTimeout(go,ms*2+2000)}
  else setTimeout(go,ms);
}
function unlockQ(){
  cur.waiting=false;
  const o=document.querySelector('.opts,.typ');if(o)o.classList.remove('wait');
  const ti=$('ti');if(ti){ti.disabled=false;try{ti.focus({preventScroll:true})}catch(e){}}
  const l=$('lis');if(l)l.innerHTML='<span class="ok">👉 À toi !</span>';
  armHint(3000);
}
// le bouton Indice se débloque un peu après le début : on réfléchit d’abord
function armHint(ms){const tk=cur.tk2;setTimeout(()=>{if(cur&&cur.tk2===tk){const b=$('hintb');if(b)b.disabled=false}},ms)}
const PRAISE=["Bravo !","Yes !","Excellent !","Top !","Bien joué !","Gagné !"];
function updStk(){const e=$('stk');if(e)e.textContent=cur.streak>=2?cur.streak+' de suite ✔':''}
function hint(){
  if(cur.locked||cur.hinted||cur.waiting||cur.hintsLeft<=0)return;
  const q=cur.qs[cur.i];cur.hinted=true;cur.hintsLeft--;cur.missed.add(q);
  const b=$('hintb');if(b)b.remove();
  if(q.type){
    const a=q.answers[0],pat=a.split('').map((ch,k)=>k===0||ch===' '?ch:'_').join(' ');
    const t=q.num?(q.hint||'Pose le calcul.'):`Le mot commence par « ${a[0]} » et a ${a.replace(/ /g,'').length} lettres.<br><b class="pat">${pat}</b>`;
    $('hint').innerHTML=`<div class="hintbox"><span class="big" style="font-size:34px">💡</span><p>${t}</p></div>`;
    if(S.auto)say(q.num?(q.hint||'Pose le calcul.'):'Le mot commence par '+a[0]);
    return;
  }
  if(q.hint){$('hint').innerHTML=`<div class="hintbox"><span class="big" style="font-size:34px">💡</span><p>${q.hint}</p>${spk(q.hint)}</div>`;if(S.auto)say(q.hint);return}
  const wrong=q.opts.map((_,k)=>k).filter(k=>k!==q.ok&&!$('o'+k).querySelector('.ans').disabled);
  if(!wrong.length)return;
  const el=$('o'+wrong[Math.floor(Math.random()*wrong.length)]);
  el.classList.add('gone');el.querySelector('.ans').disabled=true;
  if(S.auto)say('Une mauvaise réponse est enlevée');
}

  }
}
function checkTyped(){
  if(!cur||cur.locked||cur.waiting)return;
  const q=cur.qs[cur.i],inp=$('ti');if(!q||!q.type||!inp)return;
  const raw=inp.value.trim();if(!raw){inp.focus();return}
  actx();stopSay();
  let ok,exact=false;
  if(q.num){const n=numOf(raw);ok=n!==null&&q.answers.some(a=>Math.abs(n-parseFloat(a))<1e-9)}
  else if(q.strict){ok=q.answers.some(a=>lower(a)===lower(raw));exact=ok}
  else{ok=q.answers.some(a=>fold(a)===fold(raw));exact=ok&&q.answers.some(a=>lower(a)===lower(raw))}
  if(ok){
    cur.locked=true;inp.disabled=true;inp.classList.add('good');beepOk();
    const first=cur.tries===0&&!cur.hinted,gain=first?2:1;
    recordQ(q,first);reg(first);
    cur.pts+=gain;
    if(first){cur.first++;cur.streak++}else cur.streak=0;
    const r=inp.getBoundingClientRect();
    const fl=document.createElement('span');fl.className='fl';fl.textContent='+'+gain+' ⚽';
    fl.style.left=(r.left+r.width/2)+'px';fl.style.top=(r.top+window.scrollY)+'px';
    document.body.appendChild(fl);setTimeout(()=>fl.remove(),1000);
    confetti(r.left+r.width/2,r.top+r.height/2,first?40:15);
    updStk();
    feedback(true,q,(!q.num&&!exact)?'Attention aux accents : on écrit « '+q.answers[0]+' ».':'');
  }else{
    cur.tries++;cur.streak=0;updStk();cur.missed.add(q);
    beepNo();inp.classList.add('bad');
    if(cur.tries>=2){
      cur.locked=true;inp.disabled=true;recordQ(q,false);reg(false);
      feedback(false,q);
    }else{
      const msg=q.num?'🤔 Pas tout à fait. Refais le calcul.':'🤔 Presque ! Regarde bien chaque lettre.';
      $('fb').innerHTML='<div class="fb retry">'+msg+'</div>';
      const h=$('hintb');if(h&&!h.disabled)h.classList.add('hl');
      if(calm()){
        cur.waiting=true;inp.disabled=true;const tk=cur.tk=(cur.tk||0)+1;
        setTimeout(()=>{if(cur&&cur.tk===tk&&!cur.locked){cur.waiting=false;inp.disabled=false;inp.classList.remove('bad');inp.select();inp.focus()}},pace()==='self'?800:1800);
      }else{inp.classList.remove('bad');inp.select()}
    }
  }
}

function pick(k){
  if(cur.locked||cur.waiting)return;
  actx();stopSay();
  const q=cur.qs[cur.i],el=$('o'+k);
  if(k===q.ok){
    cur.locked=true;el.classList.add('good');beepOk();
    const first=cur.tries===0&&!cur.hinted,gain=first?2:1;
    recordQ(q,first);reg(first);
    cur.pts+=gain;
    if(first){cur.first++;cur.streak++}else cur.streak=0;
    const r=el.getBoundingClientRect();
    const fl=document.createElement('span');fl.className='fl';fl.textContent='+'+gain+' ⚽';
    fl.style.left=(r.left+r.width/2)+'px';fl.style.top=(r.top+window.scrollY)+'px';
    document.body.appendChild(fl);setTimeout(()=>fl.remove(),1000);
    updStk();
    feedback(true,q);
  }else{
    cur.tries++;cur.streak=0;updStk();cur.missed.add(q);
    el.classList.add('bad');el.querySelector('.ans').disabled=true;beepNo();
    if(q.opts.length===2||cur.tries>=2){
      cur.locked=true;recordQ(q,false);reg(false);$('o'+q.ok).classList.add('good');feedback(false,q);
    }else{
      if(calm()){
        cur.waiting=true;const tk=cur.tk=(cur.tk||0)+1;
        $('fb').innerHTML='<div class="fb retry">🤔 Prends ton temps…</div>';
        const h=$('hintb');if(h)h.classList.add('hl');
        setTimeout(()=>{if(cur&&cur.tk===tk&&!cur.locked){cur.waiting=false;$('fb').innerHTML='<div class="fb retry">💪 Essaie encore !</div>';if(S.auto)say('Essaie encore')}},pace()==='self'?800:1800);
      }else{
        $('fb').innerHTML='<div class="fb retry">💪 Essaie encore !</div>';
        if(S.auto)say('Essaie encore');
      }
    }
  }
}
function feedback(ok,q,note){
  const msg=ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:"Pas encore. Regarde.";
  const lastQ=cur.i===cur.qs.length-1;
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}">
    <div class="fbt">${ok?'🎉':'💡'} <b>${msg}</b></div>
    <div class="why"><p>${q.why}${note?' <b>'+note+'</b>':''}</p>${spk(q.why)}</div>
    <button class="next" id="nxt" onclick="nextQ()" ${calm()?'disabled':''}>${calm()?'🔊 J’écoute…':lastQ?'🏁 Terminer':'Suivant ➡️'}</button></div>`;
  $('fb').scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
  const speech=(ok?msg+' ':'La bonne réponse : '+(q.type?q.answers[0]:q.opts[q.ok].t)+'. ')+q.why;
  if(calm()){
    const tk=cur.ftk=(cur.ftk||0)+1;
    hold(speech,'fr',()=>{if(cur&&cur.ftk===tk){const n=$('nxt');if(n){n.disabled=false;n.textContent=lastQ?'🏁 Terminer':'Suivant ➡️'}}});
  }else if(S.auto)say(speech);
}
function nextQ(){
  cur.i++;cur.ftk=(cur.ftk||0)+1;
  if(cur.i>=cur.qs.length){finish();return}
  if(calm()&&!cur.mission&&cur.i%5===0&&cur.qs.length-cur.i>=2){pauseScreen();return}
  showQ();
}
function pauseScreen(){
  stopSay();window.scrollTo(0,0);
  const msg='Pause ! Respire un peu. Tu as fait '+cur.i+' questions sur '+cur.qs.length+'. Bravo !';
  app.innerHTML=`
  <div class="card endc">
    <div class="big">🧃</div>
    <h2>Pause</h2>
    <p>${cur.i} questions sur ${cur.qs.length}. Bravo ! ${spk(msg)}</p>
    <div class="btns">
      <button class="nb go" onclick="showQ()">▶️ On continue</button>
      <button class="nb" onclick="openSeq('${ctx.bid}','${ctx.sid}')">⬅️ Arrêter</button>
    </div>
  </div>`;
  updBar();
  if(S.auto)say(msg);
}

/* ---------- « Je retiens » : le récap à la fin de chaque jeu ---------- */
const NUM=['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣'];
// jeux du droit du travail : la diapositive-schéma de la fiche qui aide à retenir (id de jeu -> index de diapositive)
const SCHEMA={
  resp:{relier:0,quiz:1,mots:0,fd:0,intrus:1,engagee:0,enquete:0,ines:2},
  duree:{planning:0,vf:0,hs:1,limites:0,respecte:0,repos:3,pourcent:1,paie:2,mission:1}
};
function recapHtml(g,sq){
  const lang=sq.lang||'fr',qs=g.qs,L=[];let title='📌 Je retiens',flow=false,schema='',kind='';
  const c=(i,b,t,sp,l)=>({i,b,t,c:'y',s:sp||(b+'. '+t),l});
  const miss=[...cur.missed];
  if(g.id.endsWith('_ecr')){
    title='✍️ Les mots et les calculs à retenir';
    const seen={};
    qs.filter(q=>q.mode==='copy'||q.mode==='dict').forEach(q=>{const w=q.answers[0];if(!seen[w]&&L.length<4){seen[w]=1;L.push(c('✏️',w,q.sub||'',w+(q.sub?'. '+q.sub:'')))}});
    qs.filter(q=>q.mode==='num'||q.mode==='fill').slice(0,2).forEach(q=>L.push(c(q.num?'🧮':'✏️',q.num?'Le calcul':'À retenir',q.why)));
  }else{
    const st={};qs.forEach(q=>{const m=/^Étape (\d+) : (.+?)\.?$/.exec(q.why||'');if(m)st[m[1]]=m[2]});
    const ks=Object.keys(st).map(Number).sort((a,b)=>a-b);
    if(ks.length>=3){
      title='🔢 Les étapes, dans l’ordre';flow=true;
      ks.forEach(k=>L.push(c(NUM[k-1]||'▪️',st[k],'','Étape '+k+' : '+st[k])));
    }else if(qs.some(q=>q.hear)){
      title=lang==='en'?UK+' Les mots à retenir':'📌 Je retiens';
      const seen={},order=miss.filter(q=>q.hear).concat(qs);
      order.forEach(q=>{const m=/^(.+?) = (.+?)\.?$/.exec(q.why||'');if(m&&!seen[m[1]]&&L.length<5){seen[m[1]]=1;L.push(c(lang==='en'?UK:'📌',m[1],m[2],m[1],'en'))}});
    }else if(miss.length){
      kind='miss';title='📌 Ce que je retiens';
      const seen={};
      miss.forEach(q=>{
        const ok=q.opts[q.ok],bin=q.opts.length===2,key=q.text+'|'+ok.t;
        if(seen[key]||L.length>=3)return;seen[key]=1;
        L.push(bin?c(ok.i||'✅',q.text,q.why):c(ok.i||q.icon||'💡',ok.t,q.why));
      });
    }else{
      const keep=(sq.slides||[]).find(sl=>sl.keep);
      kind='keep';if(keep){title='⭐ À retenir';keep.cards.forEach(k=>L.push(Object.assign({},k)))}
    }
    const si=SCHEMA[sq.id]&&SCHEMA[sq.id][g.id],sl=si!=null&&(sq.slides||[])[si];
    if(!sl&&sq.schema&&(kind==='miss'||kind==='keep'))schema=`<p class="al" style="margin:12px 0 4px"><b>🖼️ Le schéma</b></p><div class="art">${sq.schema.svg}</div><p class="hint">👆 Touche une case pour l’écouter</p>`;
    if(sl&&sl.svg)schema=`<p class="al" style="margin:12px 0 4px"><b>🖼️ Le schéma</b></p><div class="art ${sl.cls||''}">${sl.svg}</div><p class="hint">👆 Touche un dessin pour l’écouter</p>`;
  }
  if(!L.length&&!schema)return '';
  const cards=L.map((k,i)=>(i&&flow?'<div class="arw">⬇️</div>':'')+card(k,k.l||lang)).join('');
  return `<div class="recap"><h3 class="rt">${title}</h3>${cards?`<div class="cards">${cards}</div><p class="hint">👆 Touche une carte pour l’écouter</p>`:''}${schema}${sq.slides&&sq.slides.length?`<button class="mini" style="display:block;margin:10px auto 0" onclick="fiche(0)">📘 Revoir la fiche</button>`:''}</div>`;
}

function finish(){
  if(cur.mission){finishMission();return}
  if(cur.review){finishReview();return}
  stopSay();window.scrollTo(0,0);
  const g=cur.g,max=cur.qs.length*2,r=cur.pts/max;
  const st=r>=.85?3:r>=.55?2:1;
  const record=st>(S.stars[g.id]||0);
  if(record){S.stars[g.id]=st;save()}
  const nb=checkBadges();
  const title=st===3?'BUT ! Champion !':st===2?'Bien joué !':'Tu progresses !';
  const games=cur.s.games,idx=games.indexOf(g),nxt=games[idx+1];
  const all=total()===maxStars();
  app.innerHTML=`
  <div class="card endc">
    <div class="bigstars" aria-label="${st} étoiles sur 3">${[1,2,3].map(k=>`<span class="${k<=st?'on':''}" style="animation-delay:${k*.35}s">★</span>`).join('')}</div>
    <h2>${st===3?'⚽🥅 ':''}${title}</h2>
    <p>⚽ ${cur.pts} / ${max} &nbsp; ${spk(title)}</p>
    ${nb.length?`<div class="newbd">🏅 Nouveau badge : ${nb.map(b=>b.icon+' '+b.name).join(' · ')}</div>`:''}
    ${all?'<p class="big">🏆</p><h2>Tu as toutes les étoiles !</h2>':''}
    ${recapHtml(g,cur.s)}
    <div class="btns">
      ${cur.missed.size?`<button class="nb go" onclick="review()">🔁 Revoir mes erreurs (${cur.missed.size})</button>`:''}
      <button class="nb" onclick="play('${g.id}')">🔄 Rejouer</button>
      ${nxt?`<button class="nb go" onclick="play('${nxt.id}')">${nxt.icon} Suivant</button>`:''}
      <button class="nb" onclick="pauseZone()">😄 Pause</button>
      <button class="nb" onclick="openSeq('${ctx.bid}','${ctx.sid}')">⬅️ Retour</button>
    </div>
  </div>`;
  updBar();
  if(record||nb.length){
    fanfare();
    confetti(innerWidth/2,innerHeight/3,st*60);
    if(st===3)setTimeout(()=>confetti(innerWidth*.2,innerHeight/2,50),300),setTimeout(()=>confetti(innerWidth*.8,innerHeight/2,50),500);
  }else{beepOk();confetti(innerWidth/2,innerHeight/3,12)}
  if(S.auto)setTimeout(()=>say(title),600);
}

/* ---------- revoir mes erreurs (sans changer les étoiles) ---------- */
function review(){
  const qs=cur.qs.filter(q=>cur.missed.has(q));
  if(!qs.length)return;
  cur={g:cur.g,s:cur.s,qs,i:0,pts:0,first:0,tries:0,locked:false,streak:0,missed:new Set(),review:true,hintsLeft:2};
  showQ();
}
function finishReview(){
  stopSay();window.scrollTo(0,0);
  const again=cur.missed.size,msg=again?'Tu as bien travaillé ! Encore un essai pour les dernières ?':'Bravo ! Tu as tout corrigé !';
  app.innerHTML=`
  <div class="card endc">
    <div class="big">${again?'💪':'🎉'}</div>
    <h2>${msg}</h2>
    <p>${spk(msg)}</p>
    <p class="sm">Tes étoiles ne changent pas. C’est juste pour t’entraîner.</p>
    <div class="btns">
      ${again?`<button class="nb go" onclick="review()">🔁 Encore (${again})</button>`:''}
      <button class="nb" onclick="openSeq('${ctx.bid}','${ctx.sid}')">⬅️ Retour à la séquence</button>
    </div>
  </div>`;
  updBar();
  beepOk();confetti(innerWidth/2,innerHeight/3,again?20:60);
  if(S.auto)setTimeout(()=>say(msg),500);
}

/* ---------- page « programme » (pour les profs) ---------- */
const seqName=id=>{for(const b of BLOCS){const s=b.seqs.find(x=>x.id===id);if(s)return s.icon+' '+s.name}return id};
function refView(){
  stopSay();window.scrollTo(0,0);ctx={bid:null,sid:null,v:'ref'};
  let nCov=0,nPra=0,nTot=0;
  BLOCS.forEach(b=>b.comps.forEach(c=>{if(b.id==='droit')return;nTot++;if(c.s.length)nCov++;if(c.p)nPra++}));
  const rows=BLOCS.map(b=>`<div class="card rb" style="border-top:10px solid ${b.c}">
    <h2>${b.icon} ${b.name}</h2><p class="code">${b.code}</p>
    <ul class="cl">${b.comps.map(c=>{
      const cov=c.s.length>0;
      const cm=compMas(c),ic=cov?(cm>=COMP_OK?'🏅':cm>0?'🔄':'✅'):(c.p?'🛠️':'⏳');
      const sub=cov?c.s.map(seqName).join(' · ')+(c.p?'<br>🛠️ Complété par la pratique en classe ou sur le terrain':'')+(c.n?'<br>'+c.n:''):(c.p?(c.n||'À pratiquer en vrai, en classe ou sur le terrain'):(c.n||'À compléter'));
      return `<li><span class="ci">${ic}</span><span>${c.t}<small>${sub}</small></span></li>`}).join('')}</ul></div>`).join('');
  app.innerHTML=`
  ${crumbs('📋 Le programme')}
  <div class="gtop"><button class="back" onclick="home()" aria-label="Retour">⬅️</button><h2>📋 Le programme</h2></div>
  <div class="card">
    <p><b>CAP Opérateur, opératrice logistique</b><br>Arrêté du 13 février 2026 · fiche RNCP42586 · première session d’examen en 2028</p>
    <p class="sm">Ce site reprend, bloc par bloc, les compétences attendues par le référentiel. Chaque compétence renvoie aux séquences qui la travaillent. <b>${nCov}</b> compétences sur <b>${nTot}</b> ont déjà une séquence. Pour <b>${nPra}</b> d’entre elles, il faut aussi de la pratique réelle (plateau technique, terrain, oral). Les contenus sont des révisions : ils sont à valider avec les cours de l’équipe pédagogique.</p>
    <p class="sm">🏅 maîtrisée &nbsp; 🔄 en cours &nbsp; ✅ séquence disponible &nbsp; 🛠️ à pratiquer en vrai &nbsp; ⏳ à compléter</p>
  </div>${rows}`;
  updBar();
}

updBar();
home();

</script>
